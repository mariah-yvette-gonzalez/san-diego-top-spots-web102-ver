<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>San Diego Top Spots</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>San Diego Top Spots</h1>
    </header>

    <section id="top-spots-container">
        <!-- TABLE TO LIST OUT TOP SPOTS -->
        <table>
            <thead> <!-- thead = table header -->
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Link</th>
                </tr>
            </thead>

            <tbody id="top-spots"> <!-- tbody = table body | data will be inserted here by jQuery in JS--> </tbody>
        </table>

        <div id="map-container">
            
        </div>
    </section>

    <script src="main.js"></script> <!-- main script -->

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- jQuery library -->

    <script src="config.js"></script> <!-- config.js contains the API key, but is gitignored so it won't be shared publicly.-->

    <script>
        var script = document.createElement('script');
        script.src = 'https://maps.googleapis.com/maps/api/js?key=' + CONFIG.GOOGLE_MAPS_API_KEY + '&libraries=geometry';
        document.head.appendChild(script);
    </script> <!-- Dynamically load the Google Maps API script with the API key from config.js -->

</body>

</html>
